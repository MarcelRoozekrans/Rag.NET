syntax = "proto3";

option csharp_namespace = "Rag.NET.Api.Grpc.Proto";

package rag;

service RagService {
  rpc Ingest    (IngestRequest)   returns (IngestResponse);
  rpc Retrieve  (RetrieveRequest) returns (RetrieveResponse);
  rpc Ask       (AskRequest)      returns (AskResponse);
  rpc AskStream (AskRequest)      returns (stream AskStreamUpdate);
  rpc Delete    (DeleteRequest)   returns (DeleteResponse);
}

message IngestRequest {
  string content      = 1;
  string document_id  = 2;
  string file_name    = 3;
  string content_type = 4;
  map<string,string> tags = 5;
}

message IngestResponse {
  string document_id   = 1;
  int32  chunks_stored = 2;
}

message RetrieveRequest {
  string query      = 1;
  int32  top_k      = 2;
  bool   use_hybrid = 3;
}

message SearchResultProto {
  string text        = 1;
  string document_id = 2;
  int32  chunk_index = 3;
  double score       = 4;
  map<string,string> metadata = 5;
}

message RetrieveResponse {
  repeated SearchResultProto results = 1;
}

message AskRequest {
  string query      = 1;
  int32  top_k      = 2;
  bool   use_hybrid = 3;
}

message AskResponse {
  string answer                      = 1;
  repeated SearchResultProto sources = 2;
}

message AskStreamUpdate {
  string text_delta = 1;
}

message DeleteRequest {
  string document_id = 1;
}

message DeleteResponse {}
