name: baseline-checks

# Shared security and quality baseline from ci-baseline: gitleaks, CodeQL, NuGetAudit. Pinned to the moving v1 tag.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: MarcelRoozekrans/ci-baseline/.github/workflows/baseline.yml@v1
    with:
      solution: Rag.NET.slnx
      # The solution multi-targets net10.0 and net11.0, so the audit restore needs both SDKs.
      dotnet-version: |
        10.0.x
        11.0.x
