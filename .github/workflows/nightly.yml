# Everything ci.yml cannot run on a push: the LLM tier, and the suites that need secrets.
#
# The two jobs are not alike, and the difference is the point. `llm` reports and never gates,
# because its assertions are model output. `env-gated` gates, because Tesseract, Azure Document
# Intelligence and a real ONNX model are deterministic — but it can only gate meaningfully when the
# secrets exist, and each job says so at its own definition below.
#
# DO NOT ADD THE `llm` JOB TO BRANCH PROTECTION. Not as a required check, not "just while we watch
# it". Its assertions are model output — Phase 2.1 measured `Assert.Contains("Python", answer)`
# against live Ollama failing roughly 1 run in 11 — so as a required check it would block merges on
# a model choosing different words. A gate that fails on noise teaches people to press re-run
# instead of read, at which point it has stopped being a gate and is only a tax. The reasoning lives
# in docs/plans/2026-07-28-ci-integration-coverage-design.md §2, but it is repeated here because
# nobody reads a design doc at the moment they are tempted to tick the box.
name: Nightly

on:
  schedule:
    # 03:17 UTC. A quiet hour, and deliberately off the hour: on-the-hour crons queue behind
    # everyone else's on-the-hour crons.
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled]

# The label, or the event when there is no label, is part of the group — and that is the whole
# point of it. Without it, `${{ github.workflow }}-${{ github.ref }}` puts both jobs' triggers in one
# group on a pull request: labelling a PR `run-llm` and then `run-secrets` fires two
# pull_request/labeled events on the same ref, and the second cancels the first. The labels were
# split precisely so the two jobs could be asked for independently, and a cancelled run reads as
# neither a pass nor a failure. The same mechanism made a manual workflow_dispatch on main cancel an
# in-flight scheduled nightly; `github.event_name` separates those too.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.label.name || github.event_name }}
  cancel-in-progress: true

# Both jobs read the repository and nothing else. The secrets the env-gated job needs arrive through
# `secrets.*`, which this does not affect.
permissions:
  contents: read

jobs:
  llm:
    # A pull_request/labeled event fires for every label on every PR. Only 'run-llm' means someone
    # asked for this — typically because they just changed the answer engine or a retrieval path and
    # want to see the result before merging. Opting in says "show me", not "gate me on a coin flip".
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-llm'
    # Linux on purpose: OllamaFixture is a container, and only the Linux runners have a daemon.
    runs-on: ubuntu-latest
    # Wider than ci.yml's because this job pulls about 2 GB of models before it asserts anything,
    # and still far below the 360-minute default: a model download that hangs at 3am should be
    # reported in the morning, not still running at lunchtime.
    timeout-minutes: 90
    # No RAGNET_* secrets here, deliberately. They used to sit on this job and reached nothing: the
    # only project declaring RequiresLlm reads none of them. The env-gated suites are selected by
    # their own declaration in the `secrets` job below, which is where those values now live.
    #
    # OPENROUTER_API_KEY is the exception that proves that rule, because this tier genuinely reads
    # it: TestChatClientFactory prefers an OpenRouter-backed IChatClient whenever it is set, and
    # OllamaFixture skips pulling llama3.2:1b for the same reason. Until it was added, the tier had
    # only ever taken the Ollama branch — which is how the factory's default OpenRouter model came
    # to be delisted upstream without anything noticing. Unset, the suites still pass on Ollama.
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Rag.NET.slnx

      # Load-bearing, as in ci.yml: Directory.Build.props documents an SDK regression under which
      # `dotnet test` from a completely empty obj/ still requires `dotnet build` first, and a CI
      # checkout is empty every run.
      - name: Build
        run: dotnet build Rag.NET.slnx --no-restore -c Release

      # Its own step, above the continue-on-error one and therefore still able to fail the job. An
      # empty tier is indistinguishable from a passing tier once failures are advisory, so the one
      # thing this workflow must still gate on is that it has something to run at all.
      - name: Verify the LLM tier is not empty
        run: |
          if [ -z "$(grep -l '<RequiresLlm>true</RequiresLlm>' tests/*/*.csproj)" ]; then
            echo "::error::No project declares <RequiresLlm>true</RequiresLlm>. The LLM tier has gone missing rather than passing."
            exit 1
          fi

      # Selected by declaration, never by a list of project names — the same rule as ci.yml, and
      # tests/Rag.NET.RepoConventions.Tests asserts that RequiresLlm never appears without
      # RequiresDocker, because the Ollama fixture is a container.
      #
      # continue-on-error is on this step and not on the job, deliberately. Only the assertions are
      # non-deterministic; a failed checkout, restore or build is a real breakage and still fails
      # the job. Note that these suites always pull nomic-embed-text, and pull llama3.2:1b as well
      # whenever OPENROUTER_API_KEY is unset — roughly 2 GB per run in that case, which is the
      # second independent reason this is not on every push.
      - name: Test (LLM tier)
        continue-on-error: true
        run: |
          projects=$(grep -l '<RequiresLlm>true</RequiresLlm>' tests/*/*.csproj)
          failed=""
          for project in $projects; do
            echo "::group::$project"
            assembly="$(basename "$project" .csproj).dll"
            if [ -z "$(find "$(dirname "$project")/bin/Release" -name "$assembly" -type f 2>/dev/null)" ]; then
              echo "::error::$project was never built: no $assembly under its bin/Release. Skipping it and failing, because dotnet test --no-build would print nothing and exit 0. The usual cause is that the project is missing from Rag.NET.slnx."
              failed="$failed $project"
              echo "::endgroup::"
              continue
            fi
            dotnet test "$project" --no-build -c Release --verbosity normal || failed="$failed $project"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::warning::LLM tier reported failures (advisory, not a gate):$failed"
            exit 1
          fi

  # The env-gated suites: real Tesseract, live Azure Document Intelligence, a real ONNX embedding
  # model. Every one of them calls Assert.Skip when its variable is absent, so they are safe
  # everywhere and already run — and skip — in ci.yml's fast tier. This job is the only place they
  # execute, because it is the only workflow where secrets are allowed to exist.
  #
  # THIS JOB GATES; the llm job above does not, and the difference is not arbitrary. These suites
  # are deterministic: Tesseract given the same PDF and the same traineddata produces the same text,
  # and Document Intelligence is a service with a contract, not a model writing prose. A failure
  # here is a regression, and the 1-in-11 argument that makes the LLM tier advisory simply does not
  # apply. So no continue-on-error anywhere in this job.
  #
  # What "gating" means when the secrets are absent — say it plainly, because a green tick will
  # otherwise be read as coverage: those tests skip and the job passes. That is safe (forks and PRs
  # from forks get no secrets at all), but it is not a pass in any useful sense. The presence report
  # below distinguishes "green because it ran and passed" from "green because nothing ran". Nothing
  # here fails on an absent SECRET: making that a build failure would break every fork, and the
  # repository owner already knows which secrets are configured.
  #
  # That reasoning does NOT extend to the ONNX model, the vocab or the BEIR cache directory, and
  # treating it as though it did is what made this job measure nothing for two phases. None of the
  # three is a credential: two are files anyone can download and one is a scratch directory. They
  # are provisioned by steps below and the job FAILS if the provisioning did not work, because there
  # is no fork-safety argument for skipping a test whose input the job could simply have fetched.
  #
  # RequiresSecrets is an overlay, not a fourth tier. It cuts across the fast/Docker partition that
  # ci.yml verifies rather than adding to it: these five projects are fast-tier projects, they run
  # in the fast tier on every push, and they run here as well with values supplied. A project is in
  # exactly one tier and may appear in more than one workflow.
  env-gated:
    # Its own label, not the llm one. The two jobs cost wildly different amounts and are wanted for
    # different reasons: a PR touching the PDF parser wants these deterministic suites and has no
    # use for a two-gigabyte model download. One shared label would have made the cheap job
    # unreachable without paying for the expensive one.
    # On a fork's pull request no secrets are exposed at all, so this job runs and skips everything,
    # which is the intended and safe outcome.
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-secrets'
    runs-on: ubuntu-latest
    # Wider than ci.yml's 45 now that this job actually runs the BEIR parity measurements instead of
    # skipping them. SciFact embeds 5,183 documents and its 300 judged queries on CPU — the harness
    # retrieves only for judged queries; ~355 s per separator on a fast developer machine, measured
    # when it still embedded all 1,109, and the theory runs both — and ArguAna adds ~4 min per separator,
    # so 45 minutes was a budget for a job that measured nothing. A hosted runner is slower than that
    # machine, and the bound still has to catch the real failure it is here for: a live Document
    # Intelligence call that never returns.
    #
    # This number is NOT the thing to raise when a BEIR case does not fit. Phase 3.12 added FiQA,
    # whose parity leg measures 1 h 11 m and whose real leg measured 1 h 4 m when Phase 3.15 ran it;
    # no timeout makes those two affordable here, and a job that times out reports nothing about
    # parity at all. They are gated behind RAGNET_BEIR_LONG_RUNS instead, which this job never sets,
    # and each one skips naming its own cost. BeirRunBudget holds the split and the measurements.
    timeout-minutes: 120
    env:
      # ONLY the values that are genuinely secret. secrets.* with no fallback, on purpose: an unset
      # secret leaves those tests skipping, which is safe in forks, where secrets are never exposed.
      #
      # RAGNET_ONNX_EMBED_MODEL and RAGNET_ONNX_EMBED_VOCAB used to sit here as secrets and could
      # never work. They are consumed as PATHS TO FILES — every reader calls File.Exists on them —
      # and no step put a model on the runner, so on a GitHub-hosted ubuntu-latest they resolved to
      # a path that does not exist and every ONNX-gated test skipped. Measured, not inferred: with
      # exactly the old env block, tests/Rag.NET.Embeddings.Onnx.Tests reported "Passed: 124,
      # Skipped: 1" and tests/Rag.NET.Chunking.IntegrationTests "Passed: 2, Skipped: 1". They are
      # now provisioned by the two steps below instead, because a cache directory and a model file
      # are not credentials and a secret cannot conjure either onto a fresh runner.
      #
      # RAGNET_TESSDATA is kept, and is honestly labelled: it is the one value here that still
      # reaches nothing IN THIS JOB. Its only reader, PdfOcrFallbackTests.OcrFallback_RealTesseract_*,
      # is inside `#if ENABLE_OCR`, and no workflow builds with -p:EnableOcr=true — deliberately,
      # since Phase 4.1: the published package compiles the Tesseract engine out, CI builds what it
      # ships, and the gated test is compiled and run by the fenced local procedure in
      # docs/reference/ci.md (executed green 2026-08-03). Supplying the secret here changes nothing
      # unless someone adds the OCR build flag and Tesseract's native binaries to this job, which
      # that decision argues against.
      RAGNET_TESSDATA: ${{ secrets.RAGNET_TESSDATA }}
      RAGNET_DOCINTEL_ENDPOINT: ${{ secrets.RAGNET_DOCINTEL_ENDPOINT }}
      RAGNET_DOCINTEL_KEY: ${{ secrets.RAGNET_DOCINTEL_KEY }}

      # Not secrets, and here rather than on the steps that use them for one reason: the cache key
      # below is a `with:` expression, and job-level env is unambiguously in the `env` context there
      # while a step's own env feeding that same step's `with:` is the sort of thing that resolves to
      # an empty string and degrades to a constant cache key without ever failing. Two steps read
      # MINILM_REVISION, so it also stops the two copies drifting apart.
      MINILM_REVISION: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
      MINILM_MODEL_SHA256: 6fd5d72fe4589f189f8ebc006442dbb529bb7ce38f8082112682524616046452
      MINILM_VOCAB_SHA256: 07eced375cec144d27c900241f3e339478dec958f92fddbc551f295c992038a3

      # NO reranker pins any more, deliberately (Phase 4.1). This job used to fetch, SHA-256-check
      # and cache the ~87 MB cross-encoder/ms-marco-MiniLM-L6-v2 export and export
      # RAGNET_ONNX_RERANK_MODEL/_VOCAB — and both nightly runs on the record show the download fed
      # nothing: every reader sits in the +reranker ablation cell, every reranked cell is
      # FitsTheNightly: false in BeirRunBudget (SciFact ~4 m warm plus the parity embedding price
      # cold, ArguAna ~28 m), and this job never sets RAGNET_BEIR_LONG_RUNS. Provisioning an input
      # no test consumes is the inert-path shape this repository keeps deleting, so the opt-in
      # reranked cells are provisioned by the fenced local procedure in docs/reference/ci.md
      # instead, which carries the same pinned revision and SHA-256 checks the steps here did.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Rag.NET.slnx

      # Load-bearing, as in ci.yml: Directory.Build.props documents an SDK regression under which
      # `dotnet test` from a completely empty obj/ still requires `dotnet build` first.
      - name: Build
        run: dotnet build Rag.NET.slnx --no-restore -c Release

      # ~86 MB, and the nightly would otherwise re-fetch it 365 times a year for a file that has not
      # changed since 2022. Keyed on the pinned revision, so bumping the revision below is what
      # invalidates the cache — there is nothing else in the key that could go stale against it.
      - name: Cache the all-MiniLM-L6-v2 ONNX export
        id: onnx-model-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/models/all-MiniLM-L6-v2
          key: all-MiniLM-L6-v2-onnx-${{ env.MINILM_REVISION }}

      # Pinned to a revision and checked against a SHA-256, not fetched from `main` and trusted.
      # `main` is a branch on someone else's repository: it can be force-pushed, and a silently
      # different model would move the SciFact parity number by an amount nobody could attribute.
      # This is the same discipline BeirDatasetCache already applies to the dataset with BEIR's
      # published MD5, for the same reason.
      #
      # If a checksum fails, do NOT edit the checksum to match. Check whether upstream republished
      # the revision (it should not be able to) before changing anything here.
      - name: Fetch the all-MiniLM-L6-v2 ONNX export
        if: steps.onnx-model-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/$MINILM_REVISION"
          dir="$RUNNER_TEMP/models/all-MiniLM-L6-v2"
          mkdir -p "$dir"
          curl -fsSL --retry 3 --retry-all-errors -o "$dir/model.onnx" "$base/onnx/model.onnx"
          curl -fsSL --retry 3 --retry-all-errors -o "$dir/vocab.txt"  "$base/vocab.txt"
          echo "$MINILM_MODEL_SHA256  $dir/model.onnx" | sha256sum -c -
          echo "$MINILM_VOCAB_SHA256  $dir/vocab.txt"  | sha256sum -c -

      # The two ONNX variables and the BEIR cache are set HERE rather than in the job's `env:`
      # block, and that is not a style choice: `runner` is not one of the contexts available to
      # `jobs.<id>.env`, and a literal "$RUNNER_TEMP/beir" would reach the test process unexpanded.
      #
      # RAGNET_BEIR_CACHE is a plain runner path and was never a secret. BeirDatasetCache downloads
      # SciFact on demand into it and verifies BEIR's published MD5, so the only thing the variable
      # has to name is a writable directory. It was omitted from this job entirely until now, which
      # meant SciFactParityTests skipped every night and the job went green having measured nothing.
      #
      # RAGNET_ONNX_RERANK_MODEL/_VOCAB are deliberately NOT exported: their only readers are the
      # opt-in reranked ablation cells this job's budget excludes — see the reranker note on the
      # env block above, and the fenced local procedure in docs/reference/ci.md that provisions
      # them for an opted-in run.
      - name: Point the env-gated suites at the model and the dataset cache
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/models/all-MiniLM-L6-v2"
          for file in "$dir/model.onnx" "$dir/vocab.txt"; do
            if [ ! -s "$file" ]; then
              echo "::error::$file is missing or empty after the fetch/cache steps. Failing rather than exporting a path that does not exist, because every reader of these variables calls File.Exists and would silently skip instead."
              exit 1
            fi
          done
          {
            echo "RAGNET_ONNX_EMBED_MODEL=$dir/model.onnx"
            echo "RAGNET_ONNX_EMBED_VOCAB=$dir/vocab.txt"
            echo "RAGNET_BEIR_CACHE=$RUNNER_TEMP/beir"
          } >> "$GITHUB_ENV"

      # Presence only, never a value. Without this the log cannot tell a real pass from a run in
      # which every env-gated test skipped, and those look identical in the summary.
      #
      # EVERY variable this job supplies is listed, and the list is the point. RAGNET_BEIR_CACHE was
      # missing from both the env block and this loop, so the one omission that mattered was also
      # the one omission this report could not have shown. Add a variable to the job, add it here.
      #
      # RAGNET_BEIR_LONG_RUNS is the exception that proves it: this job deliberately does NOT set it,
      # and it is listed anyway so the log says so out loud. It opts into the BEIR measurements that
      # do not fit this job's 120 minutes — FiQA under either protocol, and every dataset's real
      # chunking leg; see BeirRunBudget for the measured costs. Reporting it unset is the difference
      # between "the long runs were off tonight" and a test count nobody can interpret.
      #
      # RAGNET_ONNX_RERANK_MODEL/_VOCAB stay listed for the same reason RAGNET_BEIR_LONG_RUNS does:
      # this job deliberately stopped provisioning them (Phase 4.1 — the download fed nothing this
      # job runs), and a log that prints them unset says the reranked cells were off tonight rather
      # than leaving that to be inferred.
      - name: Report which env-gated variables are present
        run: |
          for name in RAGNET_TESSDATA RAGNET_DOCINTEL_ENDPOINT RAGNET_DOCINTEL_KEY \
                      RAGNET_ONNX_EMBED_MODEL RAGNET_ONNX_EMBED_VOCAB \
                      RAGNET_ONNX_RERANK_MODEL RAGNET_ONNX_RERANK_VOCAB RAGNET_BEIR_CACHE \
                      RAGNET_BEIR_LONG_RUNS; do
            if [ -n "${!name}" ]; then echo "$name: set"; else echo "$name: unset — its tests will skip"; fi
          done

      # As in ci.yml's LLM check: an empty selection is indistinguishable from a passing one, and
      # this job's whole purpose is that the env-gated projects are reached at all.
      - name: Verify the secrets overlay is not empty
        run: |
          if [ -z "$(grep -l '<RequiresSecrets>true</RequiresSecrets>' tests/*/*.csproj)" ]; then
            echo "::error::No project declares <RequiresSecrets>true</RequiresSecrets>. The env-gated suites have gone missing rather than passing."
            exit 1
          fi

      # Selected by declaration, never by a list of project names — the same rule as every other
      # selection in these workflows, and the same 'Microsoft.NET.Test.Sdk' filter, so all three
      # workflows agree on what a test project is. tests/Rag.NET.RepoConventions.Tests asserts in
      # both directions that a project reading a RAGNET_ variable declares the property and that
      # this file still selects on it.
      - name: Test (env-gated suites)
        run: |
          projects=$(grep -l 'Microsoft.NET.Test.Sdk' tests/*/*.csproj \
            | xargs -r grep -l '<RequiresSecrets>true</RequiresSecrets>')
          failed=""
          for project in $projects; do
            echo "::group::$project"
            assembly="$(basename "$project" .csproj).dll"
            if [ -z "$(find "$(dirname "$project")/bin/Release" -name "$assembly" -type f 2>/dev/null)" ]; then
              echo "::error::$project was never built: no $assembly under its bin/Release. Skipping it and failing, because dotnet test --no-build would print nothing and exit 0. The usual cause is that the project is missing from Rag.NET.slnx."
              failed="$failed $project"
              echo "::endgroup::"
              continue
            fi
            dotnet test "$project" --no-build -c Release --verbosity normal || failed="$failed $project"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Env-gated suites failed:$failed"
            exit 1
          fi
