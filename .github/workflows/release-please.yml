name: Release Please

# The release half of the versioning design (the derivation half is GitVersion — see
# GitVersion.yml): release-please reads the conventional commits since the last release,
# opens a pull request proposing the version they imply, and — when that PR is merged and
# this workflow is dispatched again — creates the GitHub release and the vX.Y.Z tag.
# That tag is what flips GitVersion from prerelease (0.1.0-preview.N) to stable: on the
# tagged commit it returns the tag's version, and publish-nuget packs and pushes exactly
# that. The user merges the release PR, as every PR here — this workflow only proposes.
#
# THE GATE IS GONE, and that is a deliberate change rather than an erosion. Until v1.0.0 this
# workflow was dispatch-only, because a push trigger would have proposed a release nobody had
# asked for, months before Phase 6.3 chose the first version. **6.3 executed on 2026-09-15**:
# v1.0.0 is tagged and 73 packages are on nuget.org. The condition the gate existed to protect —
# "nothing proposes a release before someone decides the first version" — cannot be violated
# again, because the first version is decided and released.
#
# From 1.0.0 onward the release PR tracks main continuously: every merge updates its changelog
# and its proposed version, so the next release is always one merge away rather than a procedure
# somebody has to remember. The two properties that actually matter are unchanged:
#
#   1. THE USER STILL MERGES THE RELEASE PR. This workflow only ever proposes. A release PR
#      sitting open is not a release, and nothing here can make it one.
#   2. PUBLISHING IS STILL SEPARATELY GATED. The tag this workflow creates does not publish
#      anything — `publish-nuget` in ci.yml needs its own workflow_dispatch with
#      publish_to_nuget=true. Two independent human decisions still stand between a merge and
#      a package on nuget.org.
#
# workflow_dispatch is kept alongside the push trigger, for re-running after a flake and for
# the case a push event was never delivered.
#
# ONE GITHUB BEHAVIOUR WORTH KNOWING: events raised by the built-in GITHUB_TOKEN do not start
# workflow runs, which is the rule that stops workflows triggering themselves forever. It does
# not affect the flow here, because a human merges the release PR and a human's merge is a real
# push. It IS why the release PR itself arrives with no CI on it — see docs/reference/ci.md.
on:
  # Keeps the release PR current with main. Merging that PR is itself a push to main, so the
  # same trigger then creates the tag and the GitHub release — no second dispatch needed.
  push:
    branches: [main]
  workflow_dispatch:

# release-please writes: the release PR (contents for the branch, pull-requests for the PR)
# and, on the run triggered by that PR's merge, the tag and the GitHub release.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # release-type simple: the release PR maintains CHANGELOG.md and a version.txt, and
      # nothing in the build consumes either — GitVersion derives the build's version from
      # the tag this workflow creates, not from a file.
      #
      # The version rules live in release-please-config.json rather than in this input, so the
      # two pre-1.0 bumps can be stated: bump-minor-pre-major keeps a breaking change on 0.x at
      # a minor bump instead of jumping to 1.0.0, and bump-patch-for-minor-pre-major keeps a
      # feature at a patch. Without them the first `feat!:` after 0.1.0 would propose 1.0.0 and
      # nothing would ask whether that was intended. .release-please-manifest.json records the
      # last released version — 0.0.0, because nothing has been released — and the two files
      # must exist together: the config is what puts release-please into manifest mode.
      #
      # The first release's version is still chosen rather than derived. A `Release-As: x.y.z`
      # footer on an empty commit overrides whatever the commits imply; the procedure in
      # docs/reference/ci.md records it.
      - name: Create or update the release pull request
        uses: googleapis/release-please-action@v5
        with:
          release-type: simple
