name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # nightly.yml has had this since 3.5; ci.yml did not, and the gap showed the first time it
  # mattered. GitHub does not trigger workflows for a push carrying more than 1,000 commits, and
  # this repository's initial push carried 1,321 — so the first CI run this project ever had could
  # not be started at all, by any means, until this trigger existed. It is also what you want for a
  # re-run after a flake or a runner outage, neither of which should require an empty commit.
  workflow_dispatch:
    inputs:
      # Half of the publish-nuget gate; the other half is nuget.org's Trusted Publishing
      # policy for this repository and workflow. Underscores,
      # not hyphens, so the job's `if:` dereferences it without leaning on expression-syntax
      # subtleties nothing exercises before release day. Defaulting false keeps every ordinary
      # dispatch — the re-run-after-a-flake case above — exactly what it was.
      publish_to_nuget:
        description: "Push the packed packages to nuget.org — Phase 6.3's release procedure; see docs/reference/ci.md"
        type: boolean
        default: false

# Deliberate divergence from the house ci.yml (MarcelRoozekrans/AdoNet.Async), earned by scale:
# that repository is a library with 40 tests, this one has 64 test projects and a Docker tier.
# Without cancel-in-progress, three pushes to a branch queue three complete runs, containers and
# all, and the first two are already irrelevant before they start.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This job reads the repository and nothing else: no comments, no statuses, no packages. The default
# is repository-configurable and therefore not a default at all, so it is stated here.
permissions:
  contents: read

jobs:
  build-test:
    # Two operating systems on purpose. Milestone 3 was closed on "all test projects passing" while
    # Rag.NET.Benchmarks.Quality.Tests was failing on Windows — every job here ran on ubuntu-latest,
    # so CI could not see it, and the primary development machine is Windows. The defect was not
    # exotic: NTFS refuses to rename a directory while any handle is open beneath it, an on-access
    # scanner holds one on just-written files, and three classes publish by rename — the safe-write
    # idiom this repository uses deliberately. POSIX rename() has no such restriction, so Linux will
    # never report that class of bug. The failing tests were fast-tier, which is why this matrix
    # would have caught it on the push that introduced it.
    #
    # The Docker tier below stays Linux-only and is skipped on Windows by an `if:` on its own step.
    # Testcontainers uses Linux images, which Windows runners can host only under nested
    # virtualisation — slow and flaky enough to turn a gating job into noise, and a gate that fails
    # for reasons unrelated to the change teaches people to re-run it.
    #
    # BRANCH PROTECTION: matrixing produces one check per OS ("build-test (ubuntu-latest)" and
    # "build-test (windows-latest)"), so the single pre-matrix required check no longer matches.
    # Both must be required, or gating silently drops to zero — and both ARE: the repository's
    # "Main" ruleset requires exactly these two checks on the default branch (measured
    # 2026-08-03; admins can bypass).
    runs-on: ${{ matrix.os }}
    strategy:
      # Both legs always run to completion. fail-fast would cancel the Windows leg the moment Linux
      # went red, which is precisely backwards: the whole reason this matrix exists is that the two
      # platforms fail for different reasons, and cancelling hides the one nothing else covers.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Generous for a run measured in minutes, and far below the 360-minute default. A Testcontainers
    # image pull that hangs otherwise burns six hours of runner time before anyone is told.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The second deliberate divergence from the house file: a cold restore across this dependency
      # graph costs minutes on every run. Keyed on every csproj plus Directory.Build.props, which
      # carries the shared analyzer PackageReferences — this repository has no lock files, so there
      # is nothing more precise to hash.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Rag.NET.slnx

      # Load-bearing, not an optimisation. Directory.Build.props documents an SDK regression under
      # which `dotnet test` from a completely empty obj/ still requires `dotnet build` first, and a
      # CI checkout is empty every single run. Remove this step and every `--no-build` tier below
      # stops working. Remove it only when that workaround comes out of Directory.Build.props.
      - name: Build
        run: dotnet build Rag.NET.slnx --no-restore -c Release

      # Tiers are selected by reading what each project declares about itself, never from a list of
      # project names in this file. A list fails silently in the direction that matters: add a
      # Testcontainers suite, forget the list, and it never runs again with nothing anywhere to
      # notice.
      #
      # FRAGILITY, named deliberately: the selection greps for the literal element text rather than
      # evaluating the MSBuild property. `dotnet msbuild <proj> -getProperty:RequiresDocker` is the
      # exact read, but it is one process per project and was measured at ~40s across the 64 of them
      # against ~0.07s for these greps. The pattern is the full element
      # `<RequiresDocker>true</RequiresDocker>`, which no comment in any `tests/*/*.csproj` contains
      # today — the sentence is scoped to those files because only those files are grepped, and this
      # workflow's own comments quote the element repeatedly without affecting anything. A comment
      # inside a test csproj quoting it verbatim would silently widen the Docker tier. Three guards:
      # tests/Rag.NET.RepoConventions.Tests parses the csproj XML properly, asserts that every
      # project starting a container declares the property and that this file still contains the
      # selection pipelines themselves (the commands, with comment lines stripped first — asserting
      # over the raw text matched these comments and guarded nothing); the partition check below
      # fails loudly the moment the tiers stop covering exactly the set of test projects; and each
      # tier loop refuses to run a project whose test assembly is not on disk.
      #
      # RequiresSecrets is deliberately absent from the arithmetic below. It is an overlay, not a
      # fourth tier: the five env-gated projects are fast-tier projects that also run in
      # nightly.yml with their values supplied. A project belongs to exactly one tier and may appear
      # in more than one workflow, so counting the overlay here would break a partition that is
      # correct. It is printed only, so the log shows the overlay has not silently emptied. The
      # count is prose and drifts — it said "three" at four projects and again at five — so the
      # `secrets=` line the step below prints is the number to trust, not this sentence.
      - name: Verify the tiers partition every test project
        shell: bash
        run: |
          all=$(grep -l 'Microsoft.NET.Test.Sdk' tests/*/*.csproj | wc -l)
          docker=$(grep -l '<RequiresDocker>true</RequiresDocker>' tests/*/*.csproj | wc -l)
          llm=$(grep -l '<RequiresLlm>true</RequiresLlm>' tests/*/*.csproj | wc -l)
          secrets=$(grep -l '<RequiresSecrets>true</RequiresSecrets>' tests/*/*.csproj | wc -l)
          fast=$(grep -l 'Microsoft.NET.Test.Sdk' tests/*/*.csproj \
            | xargs -r grep -L '<RequiresDocker>true</RequiresDocker>' | wc -l)
          echo "test projects: $all | fast: $fast | docker: $((docker - llm)) | llm (nightly): $llm"
          echo "secrets overlay (nightly, cuts across the tiers above): $secrets"
          if [ "$((fast + docker))" -ne "$all" ]; then
            echo "::error::Tiers do not partition the test projects: fast=$fast + docker=$docker != $all. A project in no tier runs nowhere and CI stays green because nothing ran."
            exit 1
          fi

      # Every test project that does not declare RequiresDocker. Each runs on its own so a failure
      # names the project rather than a 64-project batch, and every project runs before the step
      # fails so one break does not hide the next.
      #
      # The assembly check ahead of each `dotnet test` closes a failure mode with no symptom.
      # `dotnet test --no-build` against a project the build never produced prints nothing at all
      # and exits 0: the `|| failed=` below never fires and the step is green having run none of the
      # project's tests. That is not hypothetical — tests/Rag.NET.WebSearch.Tavily.Tests was missing
      # from Rag.NET.slnx, so `dotnet build Rag.NET.slnx` never built it and its four tests had never
      # run anywhere. tests/Rag.NET.RepoConventions.Tests now asserts every test project is in the
      # solution, but that guard only covers the one cause; this one covers every cause, because
      # what it checks is the artefact rather than the reason. Dropping --no-build is the other fix
      # and was rejected: it pays a rebuild per project across 64 of them, and it repairs the
      # symptom by making the missing build happen silently instead of reporting it.
      - name: Test (fast tier)
        shell: bash
        run: |
          projects=$(grep -l 'Microsoft.NET.Test.Sdk' tests/*/*.csproj \
            | xargs -r grep -L '<RequiresDocker>true</RequiresDocker>')
          failed=""
          for project in $projects; do
            echo "::group::$project"
            assembly="$(basename "$project" .csproj).dll"
            if [ -z "$(find "$(dirname "$project")/bin/Release" -name "$assembly" -type f 2>/dev/null)" ]; then
              echo "::error::$project was never built: no $assembly under its bin/Release. Skipping it and failing, because dotnet test --no-build would print nothing and exit 0. The usual cause is that the project is missing from Rag.NET.slnx."
              failed="$failed $project"
              echo "::endgroup::"
              continue
            fi
            dotnet test "$project" --no-build -c Release --verbosity normal || failed="$failed $project"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed test projects:$failed"
            exit 1
          fi

      # Testcontainers suites. These gate too: they are deterministic, and ubuntu-latest has a
      # daemon. RequiresLlm is excluded — that tier pulls ~2 GB of models and asserts on model
      # output, so it runs in nightly.yml instead. No continue-on-error anywhere in this job: the
      # entire point of these tiers is that they gate.
      - name: Test (Docker tier)
        # Linux-only: Testcontainers uses Linux images. See the job-level comment.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          projects=$(grep -l '<RequiresDocker>true</RequiresDocker>' tests/*/*.csproj \
            | xargs -r grep -L '<RequiresLlm>true</RequiresLlm>')
          failed=""
          for project in $projects; do
            echo "::group::$project"
            assembly="$(basename "$project" .csproj).dll"
            if [ -z "$(find "$(dirname "$project")/bin/Release" -name "$assembly" -type f 2>/dev/null)" ]; then
              echo "::error::$project was never built: no $assembly under its bin/Release. Skipping it and failing, because dotnet test --no-build would print nothing and exit 0. The usual cause is that the project is missing from Rag.NET.slnx."
              failed="$failed $project"
              echo "::endgroup::"
              continue
            fi
            dotnet test "$project" --no-build -c Release --verbosity normal || failed="$failed $project"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed test projects:$failed"
            exit 1
          fi

  # Conventional commits, enforced mechanically — release-please derives release versions from
  # commit messages (see release-please.yml), so a malformed type is a commit the release
  # tooling cannot read, not a style nit. The rules live in .commitlintrc.yml, each deviation
  # from stock config-conventional measured against this repository's history.
  #
  # Lints ONLY the commits a pull request adds, never the existing history: measured
  # 2026-08-03, 70 of the 1,506 existing commits fail even the tuned rules (none newer than
  # 2026-07-29 — the pre-convention era plus long headers), and linting them would turn a
  # gating check permanently red for commits nobody can amend. The start point is the commit
  # that introduced .commitlintrc.yml, chosen deliberately. Pull-request events only, because
  # that is where commits are introduced in this repository's flow — a push to main is a merge
  # of commits this job already linted, plus a merge commit commitlint ignores by default.
  # WorkflowWiringTests pins this wiring; change it only together with the tests.
  #
  # BRANCH PROTECTION: like pack-validate, this check is not in the required set — the "Main"
  # ruleset requires only the two build-test legs (measured 2026-08-03). It runs on every pull
  # request and fails loudly, but nothing mechanically blocks a merge on it until it is added to
  # the required checks — scheduled, with pack-validate, on Phase 6.3's checklist in the ROADMAP.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The full history, so the PR's base and head commits are both present to lint between.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Versions pinned to what was measured against the full history on 2026-08-03; the two
      # packages version independently (cli 21.2.1, config 21.2.0), which is why the pins differ.
      - name: Lint the commits this pull request adds
        run: >
          npx --yes --package @commitlint/cli@21.2.1 --package @commitlint/config-conventional@21.2.0
          commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # Packs every package the solution ships and validates what was actually produced. Its own job,
  # on one OS, deliberately: a .nupkg is platform-independent, so packing inside the build-test
  # matrix would produce the same 70 packages twice and validate them twice, doubling minutes for
  # zero coverage. ubuntu-latest because it is the cheaper, faster leg.
  #
  # The validation is tests/Rag.NET.PackageValidation.Tests, and it is the only guard there is:
  # Phase 4.1's Task 1 measured that dotnet pack enforces none of its metadata — a missing licence,
  # authors, URLs or tags emits nothing, a missing README is a codeless advisory, and a missing
  # description silently ships as the literal string "Package Description". Those tests skip when
  # artifacts/packages does not exist (the matrix legs, a fresh checkout); WorkflowWiringTests in
  # the same project runs unconditionally in the fast tier and pins the two commands below, so the
  # skip cannot rot into permanent green if someone renames this job's output directory or deletes
  # its validate step.
  #
  # BRANCH PROTECTION: this check is named "pack-validate" and is NOT currently in the required
  # checks — the "Main" ruleset requires "build-test (ubuntu-latest)" and "build-test
  # (windows-latest)" only (measured 2026-08-03). Until it is added there, this job can go red
  # without blocking a merge, which is exactly the non-gating-check failure this repository has
  # already documented. Adding it is scheduled: Phase 6.3's checklist in the ROADMAP.
  pack-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # GitVersion derives the version from history and refuses a shallow clone — the
          # default fetch-depth of 1 fails the derive step below, loudly.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The version every package packs with, derived from history by GitVersion
      # (GitVersion.yml; the tool is pinned in .config/dotnet-tools.json, output parsed with
      # jq — the house convention). Before this step every package packed as 1.0.0, the SDK
      # default nobody chose. Until Phase 6.3 cuts the first tag via release-please, every
      # derived version is a prerelease — 0.1.0-preview.N on main — because Milestones 4 and 5
      # publish nothing and must not produce a version that claims otherwise.
      #
      # The regex guard is load-bearing: `-p:Version=` with an empty value silently packs
      # 1.0.0 again, which is exactly the inert-path shape this phase exists to kill —
      # EveryPackageCarriesTheVersionGitVersionDerives in Rag.NET.PackageValidation.Tests
      # re-derives the version after packing and fails the job on any mismatch, and
      # WorkflowWiringTests pins this command text; change either only together with the tests.
      - name: Derive the package version
        shell: bash
        run: |
          dotnet tool restore
          version=$(dotnet dotnet-gitversion /output json | jq -r '.SemVer')
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::GitVersion produced '$version', which is not a version. Packing would fall back to the SDK default 1.0.0 without a word — failing here instead."
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "packing as $version"

      # Builds as it packs — no --no-build, because nothing has built in this job yet. The output
      # directory is the path ProducedPackageTests reads, and WorkflowWiringTests pins this exact
      # command text; change either only together with the tests.
      - name: Pack
        run: dotnet pack Rag.NET.slnx -c Release -o artifacts/packages -p:Version="$PACKAGE_VERSION"

      # Fails the job on any defective package — count, licence, README-in-package, description,
      # repository commit, symbols, emptiness. Validation must fail the build, not warn: a warning
      # nobody reads is the shape this project keeps finding.
      - name: Validate the produced packages
        run: dotnet test tests/Rag.NET.PackageValidation.Tests -c Release --verbosity normal

      # Rehearses the push against a local directory feed, so the command Phase 6.3 runs for real
      # has been executed on every push since 4.1 — design §1's rule: everything except the
      # credential and the endpoint runs every time. Every claim below was measured on 2026-08-03
      # and is pinned by an assertion, because a push that silently no-ops looks identical to one
      # that worked:
      #
      #   - The quoted glob is expanded by NuGet itself, with the platform-native separator —
      #     forward slashes match on the Linux runner and nothing else runs this job. A directory
      #     feed delivers flat: one file per package, same name, no hierarchy.
      #   - --skip-duplicate is the deliberate duplicate policy for 6.3: nuget.org never forgets
      #     a published version, so a push that dies partway (40 of 70 delivered) must be
      #     re-runnable, and without the flag the rerun fails on the first already-published
      #     package. The flag makes the push idempotent, which is the only retry-safe shape
      #     against an append-only feed. A directory feed cannot exercise the skip itself — the
      #     CLI warns "The option to skip duplicates is not currently supported for this type of
      #     push" (expected in this log, once per package) and overwrites instead of 409ing —
      #     so what is proven here is that the exact 6.3 command line parses and delivers; the
      #     409-skip is part of the recorded residual in docs/reference/ci.md.
      #   - A .snupkg push to a directory feed is a complete silent no-op: exit 0, no output,
      #     nothing delivered — measured with an exact filename and with the glob. It is
      #     attempted anyway and asserted to deliver nothing, so the day NuGet starts delivering
      #     symbol packages to directory feeds this step fails and the rehearsal widens to
      #     assert their arrival. Symbol delivery to nuget.org rides on the .nupkg push
      #     automatically (--no-symbols exists to turn that off) and cannot be rehearsed against
      #     a directory; it is exercised for real exactly once, at 6.3.
      #
      # WorkflowWiringTests pins both push commands; change them only together with the tests.
      - name: Push every package to a local feed
        shell: bash
        run: |
          shopt -s nullglob
          feed="$RUNNER_TEMP/local-feed"
          mkdir -p "$feed"
          packages=(artifacts/packages/*.nupkg)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::artifacts/packages contains no .nupkg, so the push would rehearse nothing while exiting 0. The pack output directory and this step's glob have drifted apart."
            exit 1
          fi
          dotnet nuget push "artifacts/packages/*.nupkg" --source "$feed" --skip-duplicate
          dotnet nuget push "artifacts/packages/*.snupkg" --source "$feed" --skip-duplicate
          for package in "${packages[@]}"; do
            if [ ! -f "$feed/$(basename "$package")" ]; then
              echo "::error::$(basename "$package") was pushed and did not arrive in the local feed — the push no-opped silently, which is exactly the failure this step exists to surface."
              exit 1
            fi
          done
          snupkg_arrived=$(find "$feed" -name '*.snupkg' -type f | wc -l)
          if [ "$snupkg_arrived" -ne 0 ]; then
            echo "::error::$snupkg_arrived .snupkg files arrived in the local feed. When this was written a directory feed silently dropped symbol packages; NuGet now delivers them, so widen this rehearsal to assert their arrival instead of their absence."
            exit 1
          fi
          echo "${#packages[@]} packages pushed and verified present in the local feed"

      # The same push a second time — the rerun shape 6.3 hits if a push dies partway, because
      # nuget.org never forgets a published version. Against a directory feed a duplicate is a
      # silent overwrite, not a 409, so this proves something deliberately narrow: re-running the
      # exact push command exits 0 and leaves the feed with the same packages rather than failing
      # or accumulating. The skip that --skip-duplicate buys against a real 409 is in the
      # recorded residual — a directory feed cannot produce a 409 to skip.
      - name: Push the same packages a second time
        shell: bash
        run: |
          feed="$RUNNER_TEMP/local-feed"
          before=$(find "$feed" -type f | wc -l)
          dotnet nuget push "artifacts/packages/*.nupkg" --source "$feed" --skip-duplicate
          after=$(find "$feed" -type f | wc -l)
          if [ "$before" -ne "$after" ]; then
            echo "::error::The duplicate push changed the feed from $before to $after files. A repeated push must be idempotent — if it is not, a 6.3 retry after a partial failure does something other than complete the release."
            exit 1
          fi
          echo "duplicate push exited 0 and left the feed unchanged at $after files"

  # The one step the pipeline cannot exercise before Phase 6.3: the real push to nuget.org.
  # Everything about it except the credential and the endpoint already runs on every push —
  # the pack command is character-identical to pack-validate's, and the push command's shape
  # (the quoted glob, --skip-duplicate) is rehearsed twice against a local feed in the same
  # workflow. This job repacks rather than transferring pack-validate's output through an
  # artifact, deliberately: upload/download wiring used only here would itself first run on
  # release day, which is the inert-path shape this phase exists to kill. No NuGet cache step
  # either, for the same reason — this job carries the fewest steps that can release.
  #
  # THE GATE, recorded to the standard TestGateTests holds every other gate in this repository
  # to — named, condition stated, satisfiable by a documented procedure:
  #   NAME: publish-nuget.
  #   CONDITION: a manual workflow_dispatch on main with publish_to_nuget=true, plus a Trusted
  #     Publishing policy on nuget.org and the NUGET_USER variable — when no key is minted the
  #     push fails loudly below instead of 401ing.
  #   SATISFIED BY: the fenced procedure in docs/reference/ci.md ("The gated nuget.org push"),
  #     runnable by any maintainer; Phase 6.3 executes it.
  # TestGateTests scans test gates — RAGNET_* variables, #if symbols, skip attributes — not
  # workflow `if:` conditions, so this gate sits outside that guard. It is pinned instead by
  # WorkflowWiringTests in the gating fast tier: the condition, the endpoint, the command text
  # and the documented procedure all fail a push the moment they drift.
  #
  # RESIDUAL, recorded rather than papered over (docs/reference/ci.md states it in full): a
  # local feed is not nuget.org. Authentication, API-key scoping, package-ID availability, the
  # service's own validation, the real 409-skip and .snupkg symbol delivery are exercised for
  # real exactly once, at 6.3.
  publish-nuget:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_nuget && github.ref == 'refs/heads/main'
    # Both gating jobs must be green on this exact commit before anything reaches nuget.org: the
    # full test matrix, and the validation that packs and rehearses the push. A dispatch with the
    # input set runs them all; this job refuses to start until they pass.
    needs: [build-test, pack-validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Trusted Publishing mints a short-lived key from an OIDC token, so this job needs
    # id-token: write. A job-level permissions block REPLACES the workflow-level one rather than
    # merging with it, so contents: read is restated here — dropping it would leave the checkout
    # below without read access, and the failure would look like a repository problem rather than
    # a permissions one.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # GitVersion derives the version from history and refuses a shallow clone.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Character-identical to pack-validate's derive step, for the same reason as the pack
      # step below: the version 6.3 publishes must be derived by a command that has run green
      # on every push since Phase 4.1. On the release commit — tagged vX.Y.Z by release-please,
      # see release-please.yml — GitVersion returns the tag's stable version; on every dispatch
      # before that it returns a prerelease, which nuget.org would list as such.
      - name: Derive the package version
        shell: bash
        run: |
          dotnet tool restore
          version=$(dotnet dotnet-gitversion /output json | jq -r '.SemVer')
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::GitVersion produced '$version', which is not a version. Packing would fall back to the SDK default 1.0.0 without a word — failing here instead."
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "packing as $version"

      # Character-identical to pack-validate's pack step, so the packages pushed are packed by a
      # command that has run green on every push since Phase 4.1.
      - name: Pack
        run: dotnet pack Rag.NET.slnx -c Release -o artifacts/packages -p:Version="$PACKAGE_VERSION"

      # The .snupkg files are not pushed separately: nuget.org receives them automatically
      # alongside each .nupkg when they sit in the same directory, which pack guarantees and
      # ProducedPackageTests asserts (--no-symbols is the flag that would turn that off, and it
      # is deliberately absent). --skip-duplicate is the duplicate policy chosen and rehearsed in
      # pack-validate: nuget.org never forgets a published version, so a push that dies partway
      # must be re-runnable, and without the flag the retry fails on whatever already arrived.
      # Trusted Publishing, not a stored key. NuGet deprecated long-lived API keys in favour of
      # this; the token minted here lasts minutes and cannot be exfiltrated from the repository
      # because it does not exist there. It requires a matching Trusted Publishing policy on
      # nuget.org naming this repository and workflow — a portal-side step, not a YAML one, and
      # the only part of this that cannot fail until the push itself runs. The procedure is in
      # docs/reference/ci.md.
      - name: Mint a short-lived nuget.org key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push every package to nuget.org
        shell: bash
        env:
          # The push command below is character-identical to what it was under the stored key,
          # deliberately: only the origin of the credential changed, so the command that Phase
          # 4.1 rehearsed against a local feed on every push is still the command that runs.
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::The NuGet login step minted no key, so this push cannot authenticate. Check the NUGET_USER repository variable and the Trusted Publishing policy on nuget.org — both are in the gate's procedure in docs/reference/ci.md."
            exit 1
          fi
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
