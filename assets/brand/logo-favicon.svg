       Ring: outer r 96 / inner r 64 about (128,144), its ends cut on the radii at 30 degrees above horizontal, where r 96 meets the grid line y 96.
       Radial ends make every ink join 90 degrees (a flat cut at y 96 met the inner circle at 41 degrees, under correction 7's floor).
       Chunk: a circular segment of r 64 (the ring's inner radius) about (128,80) — top y 16, chord y 48, so it is 32 deep, the weight.
       Its cusps meet the chord at 60 degrees, construction.md correction 7's floor. The ring's inner ends fall at x 72.57 / 183.43 —
       exactly the chunk's chord ends, so the opening is the chunk's own width (110.85): the lid that came out of the gap.
       Ink y 16 ... 240 (fills the live area on the longer axis), x 32 ... 224. 6 nodes against the master's 8.
       Uniform weight: correction 4 declined — 32 -> 30.72 is 2.00 px against 1.92 px at the only sizes this variant renders at. -->
